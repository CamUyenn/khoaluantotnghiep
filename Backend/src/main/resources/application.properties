spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/KLTN?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cau hinh UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# CORS (frontend)
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000}

# Gemini API (free tier)
ai.gemini.enabled=${AI_GEMINI_ENABLED:true}
ai.gemini.api-key=${GEMINI_API_KEY:}
#ai.gemini.api-key=AIzaSyDwJDbEahIprB8baJvAoiyackjR6Fi0-xw
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
ai.gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:20}
ai.gemini.history-context-messages=${GEMINI_HISTORY_CONTEXT_MESSAGES:12}
ai.gemini.history-return-messages=${GEMINI_HISTORY_RETURN_MESSAGES:100}
ai.gemini.clinic-working-hours=${CLINIC_WORKING_HOURS:Thứ 2 - Thứ 7: 08:00 - 17:00; Chủ nhật: 08:00 - 11:00}
ai.gemini.clinic-hotline=${CLINIC_HOTLINE:1900 1234}
ai.gemini.clinic-address=${CLINIC_ADDRESS:123 Đường Lý Thường Kiệt, phường Thuận Hóa, TP. Huế}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Danh sach email le tan nhan thong bao dat lich moi (cach nhau boi dau phay)
# clinic.notification.receptionist.emails=${RECEPTIONIST_NOTIFICATION_EMAILS:${RECEPTIONIST_NOTIFICATION_EMAIL:}}
clinic.notification.receptionist.emails=${RECEPTIONIST_NOTIFICATION_EMAILS:}

# Redis (luu OTP quen mat khau)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5s

# Cau hinh nguong OTP quen mat khau
auth.forgot-password.otp.ttl-minutes=10
auth.forgot-password.otp.cooldown-seconds=60
auth.forgot-password.otp.send-limit-window-minutes=60
auth.forgot-password.otp.max-send-attempts=5
auth.forgot-password.otp.max-invalid-attempts=5

# JWT access token + refresh token
auth.jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:mysecretkey-mysecretkey-mysecretkey-123-access}
auth.jwt.refresh-token.secret=${JWT_REFRESH_TOKEN_SECRET:mysecretkey-mysecretkey-mysecretkey-123-refresh}
auth.jwt.access-token.ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
auth.jwt.refresh-token.ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:7}


# Logging ra file voi gioi han dung luong va so ngay luu tru
logging.file.name=${APP_LOG_FILE:logs/clinic-app.log}
logging.logback.rollingpolicy.file-name-pattern=${APP_LOG_FILE_PATTERN:logs/clinic-app.%d{yyyy-MM-dd}.%i.log.gz}
logging.logback.rollingpolicy.max-file-size=${APP_LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${APP_LOG_MAX_HISTORY_DAYS:14}
logging.logback.rollingpolicy.total-size-cap=${APP_LOG_TOTAL_SIZE_CAP:1GB}
logging.logback.rollingpolicy.clean-history-on-start=${APP_LOG_CLEAN_HISTORY_ON_START:false}


server.port=${PORT:8081}

# Payment reconciliation job
payments.reconciliation.enabled=${PAYMENTS_RECONCILIATION_ENABLED:true}
payments.reconciliation.fixed-delay-ms=${PAYMENTS_RECONCILIATION_FIXED_DELAY_MS:180000}
payments.reconciliation.initial-delay-ms=${PAYMENTS_RECONCILIATION_INITIAL_DELAY_MS:30000}
payments.reconciliation.lookback-minutes=${PAYMENTS_RECONCILIATION_LOOKBACK_MINUTES:1440}

# SePay API check
sepay.api.enabled=${SEPAY_API_ENABLED:true}
sepay.api.endpoint=${SEPAY_API_ENDPOINT:}
sepay.api.auth-token=${SEPAY_API_AUTH_TOKEN:}
sepay.api.query=${SEPAY_API_QUERY:}
sepay.api.require-amount-match=${SEPAY_API_REQUIRE_AMOUNT_MATCH:true}
sepay.api.amount-tolerance=${SEPAY_API_AMOUNT_TOLERANCE:0}

# Refund request email job
payments.refund-request.enabled=${PAYMENTS_REFUND_REQUEST_ENABLED:true}
payments.refund-request.cron=${PAYMENTS_REFUND_REQUEST_CRON:0 0 18 * * *}
payments.refund-request.cutoff-hour=${PAYMENTS_REFUND_REQUEST_CUTOFF_HOUR:18}
payments.refund-request.cutoff-minute=${PAYMENTS_REFUND_REQUEST_CUTOFF_MINUTE:0}